# dwindle
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# misc
no_border_when_single=0
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=50
repeat_delay=200
numlockon=0
xkb_rules_layout=us,ua
bind=SUPER,space,switch_keyboard_layout

# trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
mouse_natural_scrolling=0

# color
rootcolor=0x000000ff
bordercolor=0xaaaabbff
dropcolor=0x000000ff
splitcolor=0xffffffff
focuscolor=0xffffffff
maximizescreencolor=0xffffffff
urgentcolor=0x9070a9ff
scratchpadcolor=0xffffffff
globalcolor=0xffffffff
overlaycolor=0xffffffff

# eye candy
gappih=0
gappiv=0
gappoh=0
gappov=0
scratchpad_width_ratio=1.0
scratchpad_height_ratio=1.0
borderpx=2
border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

animations=0
layer_animations=0

# layout
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle

# Key Bindings

# reload config
bind=SUPER,x,reload_config

# programs
bind=SUPER,r,spawn,rofi -show run
bind=SUPER,a,spawn,rofi -show drun
bind=SUPER,q,spawn,wezterm-gui
bind=SUPER,f,spawn,wezterm-gui -e yazi
bind=SUPER,v,spawn,firefox-developer-edition

# exit
bind=SUPER,m,quit

# switch window focus
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=Alt,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right

# swap window
bind=SUPER+Alt,Up,exchange_client,up
bind=SUPER+Alt,Down,exchange_client,down
bind=SUPER+Alt,Left,exchange_client,left
bind=SUPER+Alt,Right,exchange_client,right
bind=SUPER+Alt,k,exchange_client,up
bind=SUPER+Alt,j,exchange_client,down
bind=SUPER+Alt,h,exchange_client,left
bind=SUPER+Alt,l,exchange_client,right

# switch window status
bind=SUPER,e,togglefloating,
bind=SUPER,w,togglemaximizescreen,
bind=NONE,F11,togglefullscreen,
bind=SUPER,d,killclient,
bind=SUPER,g,dwindle_toggle_split_direction

# # tag switch
# bind=SUPER,Left,viewtoleft,0
# bind=SUPER,Right,viewtoright,0
# bind=SUPER,h,viewtoleft,0
# bind=SUPER,l,viewtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+Shift,1,tag,1,0
bind=SUPER+Shift,2,tag,2,0
bind=SUPER+Shift,3,tag,3,0
bind=SUPER+Shift,4,tag,4,0
bind=SUPER+Shift,5,tag,5,0
bind=SUPER+Shift,6,tag,6,0
bind=SUPER+Shift,7,tag,7,0
bind=SUPER+Shift,8,tag,8,0
bind=SUPER+Shift,9,tag,9,0

# monitor switch
bind=SUPER,Tab,focusmon,left
bind=SUPER+Shift,Tab,tagmon,left

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-20
bind=CTRL+SHIFT,Down,movewin,+0,+20
bind=CTRL+SHIFT,Left,movewin,-20,+0
bind=CTRL+SHIFT,Right,movewin,+20,+0
bind=CTRL+SHIFT,k,movewin,+0,-20
bind=CTRL+SHIFT,j,movewin,+0,+20
bind=CTRL+SHIFT,h,movewin,-20,+0
bind=CTRL+SHIFT,l,movewin,+20,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-20
bind=CTRL+ALT,Down,resizewin,+0,+20
bind=CTRL+ALT,Left,resizewin,-20,+0
bind=CTRL+ALT,Right,resizewin,+20,+0
bind=CTRL+ALT,k,resizewin,+0,-20
bind=CTRL+ALT,j,resizewin,+0,+20
bind=CTRL+ALT,h,resizewin,-20,+0
bind=CTRL+ALT,l,resizewin,+20,+0

# mousebind
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# window rules
windowrule=isfloating:1,width:0.75,height:0.75,offsetx:0,offsety:0,appid:pavucontrol
windowrule=isfloating:1,offsetx:0,offsety:0,appid:better_control.py

# autostart
exec-once=iwgtk -i
exec-once=waybar
exec-once=awww-daemon
exec-once=awww img ~/.wallpaper --transition-type=none
